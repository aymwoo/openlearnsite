<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Speech Recognition Example</title>

    <link href="../../js/css/tailwind-utilities-2.2.19.min.css" rel="stylesheet">
</head>
<body>
<input type="text" id="search-box" placeholder="Search Baidu" class="px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-300" />
<button id="search-button" class="px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition duration-300 shadow-md border-0">Search</button>
<script>
    const recognition = window.webkitSpeechRecognition ? new webkitSpeechRecognition() : null; // 判断是否支持 webkitSpeechRecognition 
    if (recognition) {
        recognition.lang = window.navigator.language || 'en-US'; // 设置为语言 
        const searchBox = document.getElementById('search-box');
        const searchButton = document.getElementById('search-button');
        recognition.onresult = (event) => {
            const result = event.results[event.results.length - 1];
            searchBox.value = result[0].transcript;
        };
        searchButton.addEventListener('click', () => {
            const query = searchBox.value;
			
			window.location.href = ` https://www.baidu.com/s?ie=utf-8&wd=${query}`;

            document.addEventListener('keydown', (event) => {
                if (event.keyCode === 13) {
                    event.preventDefault();
                    searchButton.click();
                }
            });
            document.addEventListener('keydown', (event) => {
                if (event.keyCode === 32 && !event.repeat) {
                    recognition.start();
                }
            });
            document.addEventListener('keyup', (event) => {
                if (event.keyCode === 32 && !event.repeat) {
                    recognition.stop();
                }
            });
        });
		}
    else
        {
            console.log('浏览器不支持语音识别');
        } 
</script>
</body>
</html>
