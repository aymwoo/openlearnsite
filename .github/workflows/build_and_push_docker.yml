name: Build and Push Docker Image

on:
  workflow_run:
    workflows: ["Release Build and Publish"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:
    branches: [master, main]

permissions:
  contents: read
  packages: write

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get Release Version and Lowercase Owner
        id: version
        run: |
          # Get the latest release tag
          LATEST_TAG=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')
          echo "version=$LATEST_TAG" >> $GITHUB_OUTPUT
          
          # Convert repository owner to lowercase
          LOWERCASE_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "lowercase_owner=$LOWERCASE_OWNER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.version.outputs.lowercase_owner }}/learnsite-wz:latest
            ghcr.io/${{ steps.version.outputs.lowercase_owner }}/learnsite-wz:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max