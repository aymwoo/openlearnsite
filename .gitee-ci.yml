# Gitee Go 流水线配置：Nightly 每日构建
name: .NET Nightly Build
# 触发条件：每日凌晨2点 + 手动触发
trigger:
  schedule:
    - cron: "0 2 * * *"  # UTC 2点 = 北京时间 10点，按需改
  manual: true  # 允许手动触发

# 环境变量（全局）
variables:
  PROJECT_PATH: ./YourWebApp.sln  # 你的解决方案路径
  OUTPUT_DIR: ./publish
  NIGHTLY_VERSION: "1.0.0-nightly-$(date +%Y%m%d)-$(CI_BUILD_NUMBER)"  # 动态版本号
  GITEE_TOKEN: ${GITEE_TOKEN}  # 仓库变量里存令牌，不要明文
  RELEASE_TAG: nightly  # 固定Nightly标签，每天覆盖

stages:
  - stage: Build
    displayName: 构建与打包
    jobs:
      - job: BuildJob
        displayName: 编译 .NET 项目
        # 用 .NET SDK 镜像
        image: mcr.microsoft.com/dotnet/sdk:8.0
        steps:
          # 1. 拉取代码
          - checkout: self
            fetchDepth: 0

          # 2. 还原依赖、发布（生成可执行文件/zip）
          - name: Build & Publish
            script: |
              dotnet restore $PROJECT_PATH
              dotnet publish $PROJECT_PATH -c Release -o $OUTPUT_DIR --version-suffix $NIGHTLY_VERSION
              # 打包成zip（用于升级包）
              zip -r nightly-build.zip $OUTPUT_DIR/*

          # 3. 计算SHA256（校验用，和你之前升级方案一致）
          - name: Generate Hash
            script: |
              sha256sum nightly-build.zip > nightly-hash.txt
              cat nightly-hash.txt

          # 4. 上传构建产物（留存）
          - name: Upload Artifact
            artifacts:
              - name: nightly-build
                path: nightly-build.zip
              - name: nightly-hash
                path: nightly-hash.txt

  - stage: Release
    displayName: 发布到 Gitee Nightly Release
    dependsOn: Build
    jobs:
      - job: ReleaseJob
        displayName: 创建/更新 Nightly 预发布
        image: alpine:latest
        steps:
          # 1. 下载构建产物
          - download: Build
            artifact: nightly-build
            path: ./
          - download: Build
            artifact: nightly-hash
            path: ./

          # 2. 安装gitee-cli（用于操作Release）
          - name: Install Gitee CLI
            script: |
              apk add --no-cache curl jq
              curl -fsSL https://gitee.com/oschina/gitee-cli/releases/download/v1.1.0/gitee-linux-amd64 -o /usr/bin/gitee
              chmod +x /usr/bin/gitee
              gitee config token $GITEE_TOKEN

          # 3. 删除旧Nightly Release、创建新预发布（覆盖更新）
          - name: Publish Nightly Release
            script: |
              # 先删除已存在的nightly标签和Release
              gitee release delete --tag $RELEASE_TAG --yes || true
              gitee tag delete $RELEASE_TAG --yes || true
              # 创建新预发布Release
              gitee release create \
                --tag $RELEASE_TAG \
                --name "Nightly Build $(date +%Y-%m-%d)" \
                --body "每日开发构建，包含最新代码，仅用于测试，非稳定版。\n版本：$NIGHTLY_VERSION\n哈希：$(cat nightly-hash.txt)" \
                --pre-release \
                --assets nightly-build.zip \
                --assets nightly-hash.txt
