name: .NET Framework 4.8 Nightly 每日构建
trigger:
  schedule:
    - cron: "0 18 * * *"  # 每天北京时间 凌晨 2:00 构建
  manual: true  # 允许手动触发

variables:
  SOLUTION_NAME: "openlearnsite.sln"    # 改成你的 sln 文件名
  NIGHTLY_TAG: "nightly"              # 固定标签，每天覆盖
  GITEE_TOKEN: ${BUILD_TOKEN}         # 仓库变量里配置，不要明文

stages:
  - stage: Build
    displayName: 构建打包
    jobs:
      - job: BuildNetFx48
        displayName: 编译 .NET Framework 4.8
        pool:
          windows: yes                 # 必须用 Windows 构建机
        image: mcr.microsoft.com/dotnet/framework/sdk:4.8

        steps:
          - checkout: self
            fetchDepth: 0

          # 还原 NuGet 包
          - name: Restore NuGet
            script: |
              nuget restore ${{ variables.SOLUTION_NAME }}

          # 编译 + 发布（Release 模式）
          - name: Build & Publish
            script: |
              "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\MSBuild\Current\Bin\MSBuild.exe" ^
              ${{ variables.SOLUTION_NAME }} ^
              /t:Rebuild /p:Configuration=Release /p:OutputPath=..\publish

          # 打包成 zip（给升级程序用）
          - name: Zip Package
            script: |
              Compress-Archive -Path .\publish\* -DestinationPath nightly-build.zip -Force

          # 生成 SHA256 校验文件
          - name: Generate SHA256
            script: |
              $hash = (Get-FileHash -Path nightly-build.zip -Algorithm SHA256).Hash
              $hash | Out-File nightly-hash.txt -Encoding utf8

          # 上传构建产物
          - artifacts:
              - name: nightly-build
                path: nightly-build.zip
              - name: nightly-hash
                path: nightly-hash.txt

  - stage: Release
    displayName: 发布到 Gitee Release
    dependsOn: Build
    jobs:
      - job: Publish
        displayName: 更新 Nightly 版本
        pool:
          windows: yes
        steps:
          - download: Build
            artifact: nightly-build
            path: ./
          - download: Build
            artifact: nightly-hash
            path: ./

          # 安装 Gitee CLI
          - name: Install Gitee CLI
            script: |
              choco install gitee-cli -y
              gitee config token ${{ variables.GITEE_TOKEN }}

          # 删除旧 nightly，发布新版本
          - name: Update Nightly Release
            script: |
              gitee release delete --tag ${{ variables.NIGHTLY_TAG }} --yes 2>&1 | Out-Null
              gitee tag delete ${{ variables.NIGHTLY_TAG }} --yes 2>&1 | Out-Null

              gitee release create --tag ${{ variables.NIGHTLY_TAG }} `
              --name "Nightly 每日构建版" `
              --body "每日自动构建，包含最新代码，仅用于测试环境" `
              --pre-release `
              --assets "nightly-build.zip" `
              --assets "nightly-hash.txt"
