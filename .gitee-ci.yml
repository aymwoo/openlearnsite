name: .NET Framework 4.8 Nightly 每日构建
trigger:
  schedule:
    - cron: "0 18 * * *"  # 北京时间 凌晨2点
  manual: true

variables:
  PROJECT_DIR: "./"       # 网站项目根目录
  NIGHTLY_TAG: "nightly"
  GITEE_TOKEN: ${GITEE_TOKEN}

stages:
  - stage: Build
    displayName: 构建打包
    jobs:
      - job: BuildNetFx48
        displayName: 编译 .NET Framework
        pool:
          windows: yes
        image: mcr.microsoft.com/dotnet/framework/sdk:4.8
        
        steps:
          - checkout: self
            fetchDepth: 0

          # 网站项目直接编译发布
          - name: Build Website
            script: |
              "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\MSBuild\Current\Bin\MSBuild.exe" ^
              ./ /t:Build /p:Configuration=Release /p:OutputPath=../publish

          # 打包升级包
          - name: Zip Package
            script: |
              Compress-Archive -Path .\publish\* -DestinationPath nightly-build.zip -Force

          # 生成 SHA256 校验
          - name: Generate SHA256
            script: |
              $hash = (Get-FileHash -Path nightly-build.zip -Algorithm SHA256).Hash
              $hash | Out-File nightly-hash.txt -Encoding utf8

          # 自动生成 Changelog
          - name: Generate Changelog
            script: |
              $date = Get-Date -Format "yyyy-MM-dd"
              $log = "## Nightly $date`n"
              $commits = git log --since="1 days ago" --pretty="- %s"
              $log += $commits
              $log | Out-File CHANGELOG.md -Encoding utf8

          # 上传产物
          - artifacts:
              - name: nightly-build
                path: nightly-build.zip
              - name: nightly-hash
                path: nightly-hash.txt
              - name: changelog
                path: CHANGELOG.md

  - stage: Release
    displayName: 发布到 Gitee Release
    dependsOn: Build
    jobs:
      - job: Publish
        pool:
          windows: yes
        steps:
          - download: Build
            artifact: nightly-build
            path: ./
          - download: Build
            artifact: nightly-hash
            path: ./
          - download: Build
            artifact: changelog
            path: ./

          - name: Install Gitee CLI
            script: |
              choco install gitee-cli -y
              gitee config token ${{ variables.GITEE_TOKEN }}

          - name: Update Nightly Release
            script: |
              $changelog = Get-Content CHANGELOG.md -Raw
              gitee release delete --tag ${{ variables.NIGHTLY_TAG }} --yes 2>&1 | Out-Null
              gitee tag delete ${{ variables.NIGHTLY_TAG }} --yes 2>&1 | Out-Null
              
              gitee release create --tag ${{ variables.NIGHTLY_TAG }} `
              --name "Nightly 每日构建" `
              --body "更新内容：`n`n$changelog" `
              --pre-release `
              --assets "nightly-build.zip" `
              --assets "nightly-hash.txt"
