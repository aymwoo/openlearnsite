<html xmlns="http://www.w3.org/1999/xhtml" >
<head id="Head1" >
    <meta charset="utf-8" />
    <title></title>   
    <link href="../App_Themes/student/StyleSheet.css" rel="stylesheet" type="text/css" />
    
    <link href="../js/css/tailwind-utilities-2.2.19.min.css" rel="stylesheet">
<style>.ground { background-color: #f0f0f0; }</style></head>
<body class="ground">
    <div>
    <center>
      <div  class="studmasterhead">
            <div  class="banner" > 
                </div>
            <div class="placeauto mt-8" >
            <div >
         <div id="student">
        <div class="bg-white rounded-lg shadow-lg max-w-2xl mx-auto overflow-hidden text-left mb-6">
            <div class="bg-blue-500 text-white text-xl font-bold py-3 px-6 text-center">
                课堂守则
            </div>
            <div class="p-6 space-y-4">
                <div class="flex items-start pb-3 border-b border-gray-100">
                    <span class="text-blue-500 font-bold mr-3">1.</span>
                    <span class="text-gray-700">无请假缺席：每人扣1分</span>
                </div>
                <div class="flex items-start pb-3 border-b border-gray-100">
                    <span class="text-blue-500 font-bold mr-3">2.</span>
                    <span class="text-gray-700">迟到：每人扣0.1分</span>
                </div>
                <div class="flex items-start pb-3 border-b border-gray-100">
                    <span class="text-blue-500 font-bold mr-3">3.</span>
                    <span class="text-gray-700">吃零食带饮料：每人扣0.1分</span>
                </div>
                <div class="flex items-start pb-3 border-b border-gray-100">
                    <span class="text-blue-500 font-bold mr-3">4.</span>
                    <span class="text-gray-700">乱丢垃圾：每人扣0.1分且负责拖地一次</span>
                </div>
                <div class="flex items-start pb-3 border-b border-gray-100">
                    <span class="text-blue-500 font-bold mr-3">5.</span>
                    <span class="text-gray-700">未经老师允许玩游戏：每人扣0.1分</span>
                </div>
                <div class="flex items-start pb-3 border-b border-gray-100">
                    <span class="text-blue-500 font-bold mr-3">6.</span>
                    <span class="text-gray-700">带存储设备（mp3、U盘）并使用：每人扣0.1分</span>
                </div>
                <div class="flex items-start pb-3 border-b border-gray-100">
                    <span class="text-blue-500 font-bold mr-3">7.</span>
                    <span class="text-gray-700">故意搞乱电脑硬件，扣1分</span>
                </div>
                <div class="flex items-start">
                    <span class="text-blue-500 font-bold mr-3">8.</span>
                    <span class="text-gray-700">未经老师允许，私自下座位或换座位，扣1分。</span>
                </div>
            </div>
        </div>
        <br />
        <button id="Btnreturn" class="buttonimg px-4 py-2 bg-blue-500 text-white rounded hover:bg-blue-600 transition duration-300 shadow-md border-0" style="width: 80px;">关闭</button>

        </div>
